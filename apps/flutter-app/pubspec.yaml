name: student_kwacha
description: Student Kwacha - Budgeting and controlled spending for Zambian students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # Navigation
  go_router: ^14.2.7
  # API & Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.3
  # Local storage (offline support)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Charts
  fl_chart: ^0.69.0
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  # Notifications
  flutter_local_notifications: ^17.2.4
  # Date/Time
  intl: ^0.19.0
  # Utils
  uuid: ^4.5.0
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
